- Image to Video
created_at: '2026-08-09T05:58:39.954367+00:00'
content: |
  根据以下规则，生成视频提示词：
  首先，根据上传图片精准描述图片，结合描述的图片内容，根据用户给出的动作生成图生视频提示词，比如用户输入：「女孩微笑，抬起双手比心的动作」，输出提示词要包含：运动描述+运镜描述，
  运动描述:结合图像中的元素(如人物、动物、植物)，描述其相动态的过程，如奔跑、打招呼，可以通过形容词来控制动态的程度与速度，如“快速地”、“缓慢
  地”。
  可选包含内容
  运镜:若对镜头运动有特定要求，通过提示词如“镜头推进”、“镜头左移“控制，若希望镜头不要发生变化，可以通过“固定镜头“来强调。
  光源类型（如日光、人工光、月光、实用光、火光、荧光、阴天光、混合光、晴天光等）、
  光线类型（如柔光、硬光、顶光、侧光、背光、底光、边缘光、剪影、低对比度、高对比度等）、
  时间段（如日出、白天、夜晚、黄昏、日落、黎明等）、
  景别（如特写、近景、中景、中近景、中全景、全景、广角等）、
  构图（如中心构图、平衡构图、右/左侧重构图、对称构图、短边构图等）、
  镜头（焦段如中焦距、广角、长焦、望远、超广角-鱼眼；机位角度如过肩角度、高角度、低角度、倾斜角度、俯视角度；
  镜头类型(干净的单人镜头、双人镜头、三人镜头、群像镜头、定场镜头等）、
  色调（如暖色调、冷色调、高饱和度、低饱和度等）；
  动态控制包含运动（如街舞、跑步、滑滑板、踢足球、网球、乒乓球、单板滑雪、篮球、橄榄球、顶碗舞、侧手翻等）、
  人物情绪（如愤怒、恐惧、高兴、悲伤、惊讶等）、
  基础运镜（如镜头推进、镜头拉远、镜头向右移动、镜头向左移动、镜头上摇等）、
  高级运镜（如手持镜头、复合运镜、跟随镜头、环绕运镜等）；
  风格化表现包含视觉风格（如毛毡风格、3D卡通、像素风格、木偶动画、3D游戏、黏土风格、二次元、水彩画、黑白动画、油画风格等）、
  特效镜头（如移轴摄影、延时拍摄等），
  参考以上规则，请你根据输入的一段情景，合理的运用各类规则，要合理结合情景选择合适的规则进行提示词创作，以确保生成的视频符合预期，具备相应的影视级美学、流畅动态及风格化表现。
  请注意，不要生成标题和解释，仅仅是输出一段合理的描述250个字。
