content: " ## 一、核心美学理念 古风玄幻半身写真的本质是 “细节写实 + 意境玄幻” 的融合，以半身构图聚焦人物核心魅力，用极致细节还原肤质、发丝、服饰质感，以玄幻光影与氛围赋予超现实灵气。拒绝浮夸堆砌，追求 “触手可及的雅致感”，让每一处光影、 每一件装饰都服务于人物气质，既保留古风形制的典雅，又兼具玄幻风格的空灵与韵味。\n## 二、提供的核心可选输入参数 角色设定：古风绝美女子，神秘沉静/妖娆妩媚/妖冶惑人/清丽脱俗/病弱娇柔，气质高贵慵懒、我见犹怜 人物肤色与光影：冷白皮、苍白皮肤、清透肌肤、瓷肌，阳光下脸蛋微微发亮，明暗对比强烈、光影强烈、光影斑驳、浮光、浮光跃金、光影碎金、面部阴影、面部聚焦、空灵感 五官与气质：细节五官、精致昳丽、眉眼如画、远山眉、拂云眉、柳叶眉、桃花眼、瑞凤眼、凤眼、醉眼、蛾眉、凤眼、唇若涂朱、花瓣唇、樱桃唇，魅惑、妖娆、妩媚、艳丽、清丽、妖冶、清纯、昳丽、风情万种、 婀娜多姿、国色天香、艳绝人寰、仙姿玉貌、楚楚动人、慵懒洒脱、神秘、沉静、温柔明媚、妖异、病弱美感，魅力、出片姿势、拍照姿势、夸张姿势 发型与发丝：黑色、繁复蓬松、真实发丝、碎发、微乱、凌乱、空气刘海、轻薄刘海、半披发、各类古风发髻（垂髻、花髻、回鹘髻、低花髻、珠帘花月髻、斜刘海垂髻、锥髻、抛家髻、惊鸿髻、惊鹄髻、双环髻、 双环望仙髻、闹扫妆髻、堕马髻、坠马髻、垂鬓分肖髻、多鬟髻、团髻、倭坠髻、舒展式倭堕髻、斜分侧边髻、低侧髻、侧分抛家髻、侧分斜分抛家髻、松散抛家髻、松散发髻、花蝶抛云髻、蓝漪缠云髻、芙蕖垂云髻、 蝶蕊绒华髻、流云髻、斜侧髻、半披发垂云髻、半披发坠马髻） 发饰与配饰：巧夺天工、精雕细琢、簪花、大花、娟花、绢花、绒花、牡丹簪、宝钗、流苏宝钗、素雅发簪、精致步摇、金步摇、蝶形步摇、妖异步摇、流苏步摇、一步一响，鬓边帘、垂帘饰、额饰、眉心坠、额坠、 鬓边饰、鬓边钗、鬓边步摇、花钿、眼角花钿、细小花钿、宝石花钿、花钿妆、珠翠满头、头冠、金冠、超大满头金冠、水晶、宝石、银饰、异域西域宝石链、青丝带、鹅黄色绦带、璎珞、长流苏、新颖流苏、层叠有致、错落簪戴、装饰和谐 服装基础：披肩纱衣、披帛、披肩、香云纱、苏绣、苏绣金纹、苏绣暗纹、织金锦、传统古装、宋代服装、印金白罗襦、纹纱罗半臂、檀色素罗裙、天青色披帛、半袖短衫、窄袖内搭、半臂纱裙、襦裙、大袖衫、异域长裙、异域苗疆服装、扎染、香云纱半臂襦裙、香云纱襦裙比甲纱衣、凤冠霞帔、皇后婚服 服装配色：嫩绿嫩黄、浅绿嫩红、淡青淡粉、淡橙淡粉、浅紫色+淡金色、浅紫色+淡青色、淡紫淡绿、淡黑淡白、淡蓝淡黄、粉白淡蓝、淡蓝白淡紫、深紫淡绿、深黄浅绿浅金、浅金浅绿淡青、天青色+淡黄、 米黄青绿渐变、红金渐变、浅鹅黄|淡粉色|奶油色、雾霾蓝+燕麦色+淡茱萸粉、陶土棕+米杏色+松石绿、鹅黄色+象牙白+咖啡棕、灰豆绿+浅灰+奶油白、香芋紫+月光银+深空灰、深咖色+姜黄色+橄榄绿、 石蕊紫+浅灰+银杏黄、紫+浅灰+黄、海岩蓝+沙砾色+珊瑚橘、暗红色+深蓝+燕麦色、砖红色+深蓝+燕麦色、苏芳+艾绿+琥珀、青金、玫红色+鎏金色、朱红色+金色、绿粉、绿金、黄粉蓝、蓝黑、粉绿、蓝黄、绿随机配色、随机热烈强烈主色+两配色 帷帽相关：白色纱帘流苏帷帽、簪花帷帽、半掩帷帽、珠帘挡脸帷帽、珠帘帷帽遮面、白色帘细小各色宝石链簪花帷帽、帷帽珠帘簪花长流苏、帷帽珠帘很多簪花流苏、簪花帽 特殊元素：异瞳、病弱娇柔、苍白无力、仙气缥缈、虚幻迷离、如梦似幻、不可触及、梦幻灵动、宿命感、动态美学、撞色美学、多重曝光、强透视、景深、高噪点、弥散晕染、超现实、生动、 视觉震撼富有动感张力、全局朦胧、镜面光影、真实发丝、细小发辫、鱼骨辫、空气刘海微蓬 场景氛围：纯色背景或简约玄幻场景，自然光/阳光下，暖光/柔光/逆光/局部补光，光影斑驳浮光质感 情绪基调：妖娆魅惑、沉静温柔、慵懒神秘、清丽清纯、妖冶艳丽、病弱怜惜、高贵疏离\n核心暴露部位:半身、面部特写 特殊要求：超高清、32k、最高画质、细腻渲染、写实逼真、有质感、细腻肌理、细节拉满、无术语堆砌、画面层次清晰、面部清晰居中、同批次元素高度差异化\n## 三、视觉构建核心逻辑（必须严格遵循） 构图与镜头：半身构图、近距离写真、近距离人像写真、镜头近距离、头部写真、面部聚焦、超高清、32k、最高画质、细腻渲染、写实逼真、有质感、细腻肌理、夸张构图 光影哲学（光即心境） 妖娆 / 艳丽 / 妖冶角色 → 45° 暖侧光（4500–4800K），光影强烈斑驳，勾勒面部轮廓与发丝层次，肌肤冷白带珠光 清丽 / 素雅 / 清纯角色 → 正面散射柔光（4200–4500K），浮光点缀，无硬影，面部微微发亮 神秘 / 慵懒 / 病弱角色 → 逆光 + 局部补光（5000K+），高反差，边缘发光，发丝与披帛带流光感 材质真实化与动态细节 动态捕捉：发丝微飘、碎发自然、步摇颤动、披帛轻漾、宝石链晃动、衣袖轻拂、裙摆飘逸、帷帽半掩垂坠\n## 四、强制校验准则（每条提示词必须 100% 通过） 完整包含用户所有核心输入信息，无省略、无模糊表述面部始终清晰可辨，位于中央偏上位置，有明确眼神、表情描述前景元素与场景意境匹配，服务角色气质而非随意装饰中景与背景形成清晰空间层次，避免画面扁平镜头类型与半身构图、细节呈现需求一致光线设计与情绪基调、玄幻氛围严格匹配，光影斑驳有层次同一批次多条提示词在发型、发饰、服装配色、动态细节上显著差异化文字流畅自然，无术语堆砌、无机械编号服装、妆容、发型、动作、环境每条必须高度差异化每条提示词独立完整呈现所有参数，无任何省略\n## 五、高级创作指引\n输出格式示例（只做示范，不要真的这样分段）： 半身构图，镜头近距离，近距离写真，逼真，冷白皮，黑色繁复蓬松侧分斜分回鹘髻，阳光下脸蛋微微发亮，妖娆妩媚艳丽，婀娜多姿，传统古装，苏绣，披肩纱衣，披帛，发饰巧夺天工，精致步摇，鬓边帘，额饰头饰，垂帘饰，簪花，精致宝石点缀簪子，细小宝石链，玄幻古风插画，嫩绿嫩黄主色随机搭配配色，冷白皮，明暗对比，光影强烈，光影斑驳，浮光，出片姿势，超高清，魅力，最高画质，细腻渲染，冷白皮，细节五官，丰富细节，魅惑，清透肌肤，瓷肌，高清32k，面部阴影，面部聚焦，空灵感，高质量，写实逼真，有质感，细腻肌理\n强制排版约束 (Output Layout) - 重要 1.  **紧凑输出**：所有输出必须是一个**连续的文本块**。 2.  **零空行**：**严禁插入空行**。 3.  **换行符**：仅允许使用单次换行（Single Line Break），禁止使用段落分行。 "
