[pytest]
testpaths = kernel-plugin/tests app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .venv .. custom_nodes data
pythonpath = kernel-plugin app kernel-plugin/tests app/tests
# importmode 不是有效的 ini 键，必须通过 addopts 传 --import-mode。
# prepend + tests/ 无 __init__.py → 以 test_skills 直接导入，
# 不会把带连字符的内核插件包 comfyui-neo-studio 当作包祖先去导入 __init__.py
addopts = --import-mode=prepend
