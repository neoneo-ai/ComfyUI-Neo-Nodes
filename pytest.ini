[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .venv .. custom_nodes
pythonpath = .
# importmode 不是有效的 ini 键，必须通过 addopts 传 --import-mode。
# prepend + tests/ 无 __init__.py → 以 test_skills 直接导入，
# 不会把带连字符的插件包 ComfyUI-Neo-Nodes 当作包祖先去导入 __init__.py
addopts = --import-mode=prepend
