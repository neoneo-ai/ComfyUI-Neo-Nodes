[pytest]
testpaths = studio/tests app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .venv .. custom_nodes data
pythonpath = studio app studio/tests app/tests
# importmode 不是有效的 ini 键，必须通过 addopts 传 --import-mode。
# prepend + tests/ 无 __init__.py → 以 test_skills 直接导入；
# 插件目录名是合法标识符，导入 __init__ 会撞上插件入口，由 conftest.py 的占位包挡掉。
addopts = --import-mode=prepend
