name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  publish-node:
    name: Publish Node to Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish Custom Node to registry
        uses: comfy-org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.COMFY_REGISTRY_PUBLISH_TOKEN }}