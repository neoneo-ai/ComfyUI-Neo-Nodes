name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    name: Kernel plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # studio/tests/_comfy_api_bootstrap.py 把同级 ComfyUI 根插进 sys.path 导入真实 comfy_api
      # （_comfy_root 找 <repo 父目录>/ComfyUI/comfy_api/latest），V3 节点用例离了它必炸。
      # actions/checkout 拒绝 workspace 外的 path，只能裸 clone 到同级目录。
      - name: Clone ComfyUI as the sibling root
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI ../ComfyUI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 只装模块作用域真用到的库：torch 走 CPU wheel，av 自带 FFmpeg，packaging 是
      # comfy_api/internal/api_registry 的导入期依赖，numpy 不在 torch 的硬依赖里。
      # psutil 是同级 ComfyUI 的 comfy.model_management 导入期依赖（mem_stats 路由用例要它），
      # httpx 是 llm.py 远程后端与 openai 传输层的依赖，comfy-aimdo 是新版内核 model_management
      # 的导入期依赖（版本与内核 requirements.txt 的 pin 一致，cp39-abi3 有 manylinux wheel）。
      # laya / pillow-heif / oss2 / huggingface_hub 都是函数内可选导入，缺包时功能自行降级。
      - name: Install test deps
        run: |
          pip install pytest PyYAML openai pypinyin Pillow aiohttp av packaging numpy psutil httpx comfy-aimdo==0.5.6
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: pytest studio/tests
        run: python -m pytest -q studio/tests

  frontend:
    name: Frontend golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm ci
        run: npm ci

      # npm run test:ci 串行跑（--test-concurrency=1）：jsdom 用例吃 CPU，runner 只有 2 核，
      # 并发时带轮询的用例会撞到自己的超时，父用例超时后子用例全被 cancelledByParent。
      # npm test 自带 --test-force-exit：建节点留下的 setInterval 会把 runner 挂在 pending timer 上。
      - name: npm run test:ci
        run: npm run test:ci